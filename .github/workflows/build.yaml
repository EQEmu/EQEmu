name: Build
on:
  push:
    branches:
      - master
      - develop
  pull_request:
jobs:
  linux:
    name: Linux x86-64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build ccache uuid-dev

      - name: Restore vcpkg Cache
        uses: actions/cache@v5
        with:
          path: |
            build/vcpkg_installed
            submodules/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}-
            ${{ runner.os }}-vcpkg-

      # Provision the pinned toolchain and lockfiles while network is available.
      # CMake builds both bridges frozen/offline after this step.
      - name: Provision Rust dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy --target x86_64-unknown-linux-gnu
          cargo fetch --manifest-path rust/raycaster/Cargo.toml --locked --target x86_64-unknown-linux-gnu
          cargo fetch --manifest-path rust/actors/Cargo.toml --locked --target x86_64-unknown-linux-gnu

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LOGIN=ON \
            -DEQEMU_BUILD_LUA=ON \
            -DEQEMU_BUILD_PERL=ON \
            -DEQEMU_BUILD_CLIENT_FILES=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: |
          # IPC mutex tests need a writable shared-memory path, not root-level locks.
          mkdir -p test-runtime/shared
          printf '%s\n' '{"server":{"directories":{"shared_memory":"shared/"}}}' > test-runtime/eqemu_config.json
          cd test-runtime
          ../bin/tests
