name: CI

"on":
  push:
    branches:
      - master
      - develop
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CCACHE_DIR: /mnt/eqemu-cache/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "5"
  CCACHE_MAXSIZE: 40G
  CCACHE_NAMESPACE: eqemu-monomyth-ci
  VCPKG_ARCHIVES_DIR: /mnt/eqemu-cache/vcpkg/archives
  VCPKG_DOWNLOADS_DIR: /mnt/eqemu-cache/vcpkg/downloads

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect CI-Relevant Changes
    runs-on:
      group: EQEmu
      labels:
        - self-hosted
        - linux
    container:
      image: ubuntu:24.04
      options: --cpus 8
    outputs:
      run_full_ci: ${{ steps.filter.outputs.run_full_ci }}

    steps:
      - name: Install Git
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            git

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: false
          clean: false
          set-safe-directory: true

      - name: Trust workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Detect docs-only and safe config-only changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          predicate-quantifier: every
          filters: |
            run_full_ci:
              - '!**/*.md'
              - '!docs/**'
              - '!.github/**/*.md'
              - '!.editorconfig'
              - '!.gitignore'
              - '!.gitmodules'
              - '!.markdownlint.json'
              - '!.markdownlint.yaml'
              - '!.prettierrc'
              - '!.prettierrc.json'
              - '!.prettierrc.yaml'
              - '!.yamllint*'
              - '!.clang-format'
              - '!.clang-tidy'
              - '!.vscode/**'
              - '!.github/workflows/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/pull_request_template.md'

  lint:
    name: Lint and Static Checks
    needs: changes
    runs-on:
      group: EQEmu
      labels:
        - self-hosted
        - linux
    container:
      image: ubuntu:24.04
      options: --cpus 8
      volumes:
        - eqemu-monomyth-build-cache:/mnt/eqemu-cache
    timeout-minutes: 20

    steps:
      - name: Install lint tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            cmake \
            curl \
            git \
            golang-go \
            libdbd-mysql-perl \
            libdbi-perl \
            libjson-perl \
            libtool \
            lua5.4 \
            make \
            nasm \
            ninja-build \
            perl \
            pkg-config \
            python3 \
            shellcheck \
            tar \
            unzip \
            uuid-dev \
            yamllint \
            zip \
            zstd

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Trust workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@latest

      - name: Check YAML files
        run: |
          git ls-files -z '*.yaml' '*.yml' |
          xargs -0 --no-run-if-empty \
            yamllint -d '{extends: default, rules: {document-start: disable, line-length: disable}}'

      - name: Check JSON files
        run: |
          git ls-files -z '*.json' |
          while IFS= read -r -d '' file; do
            python3 -m json.tool "$file" >/dev/null
          done

      - name: Check whitespace
        run: |
          if git grep -nI -E '[[:blank:]]$' -- \
            '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
            '*.cmake' 'CMakeLists.txt' \
            '*.json' '*.md' '*.pl' '*.py' '*.sh' '*.lua' \
            '*.yaml' '*.yml'; then
            echo "Trailing whitespace found"
            exit 1
          fi

      - name: Check final newlines
        run: |
          git ls-files -z \
            '*.c' '*.cc' '*.cpp' '*.h' '*.hpp' \
            '*.cmake' 'CMakeLists.txt' \
            '*.json' '*.md' '*.pl' '*.py' '*.sh' '*.lua' \
            '*.yaml' '*.yml' |
          while IFS= read -r -d '' file; do
            if [ -s "$file" ] && [ "$(tail -c 1 "$file" | wc -l)" -eq 0 ]; then
              echo "$file: missing trailing newline"
              exit 1
            fi
          done

      - name: Check shell scripts
        run: |
          git ls-files -z '*.sh' |
          xargs -0 --no-run-if-empty shellcheck --severity=warning

      - name: Check Python scripts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          # vcxproj_dependencies.py is a legacy Python 2 utility.
          git ls-files -z '*.py' ':!:utils/scripts/vcxproj_dependencies.py' |
          xargs -0 --no-run-if-empty python3 -m py_compile

      - name: Check Perl scripts
        run: |
          git ls-files -z '*.pl' ':!:utils/deprecated/**' |
          while IFS= read -r -d '' file; do
            perl -c "$file"
          done

      - name: Check Lua scripts
        run: |
          git ls-files -z '*.lua' |
          xargs -0 --no-run-if-empty luac -p

      - name: Prepare configure cache
        run: mkdir -p "${VCPKG_ARCHIVES_DIR}" "${VCPKG_DOWNLOADS_DIR}"

      - name: Verify unit-test configuration
        env:
          VCPKG_FEATURE_FLAGS: binarycaching
          VCPKG_BINARY_SOURCES: clear;files,${{ env.VCPKG_ARCHIVES_DIR }},readwrite
          VCPKG_DOWNLOADS: ${{ env.VCPKG_DOWNLOADS_DIR }}
        run: |
          cmake -S . -B build/lint-configure -G Ninja \
            -DEQEMU_BUILD_SERVER=OFF \
            -DEQEMU_BUILD_LOGIN=OFF \
            -DEQEMU_BUILD_CLIENT_FILES=OFF \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LUA=OFF \
            -DEQEMU_BUILD_PERL=OFF

  production-build:
    name: Production Build Smoke Test
    needs:
      - changes
      - lint
      - unit-tests
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on:
      group: EQEmu
      labels:
        - self-hosted
        - linux
    container:
      image: ubuntu:24.04
      options: --cpus 8
      volumes:
        - eqemu-monomyth-build-cache:/mnt/eqemu-cache
    timeout-minutes: 90

    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            curl \
            git \
            libtool \
            make \
            nasm \
            ninja-build \
            perl \
            pkg-config \
            python3 \
            tar \
            unzip \
            uuid-dev \
            zip \
            zstd

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Trust workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare caches
        run: |
          mkdir -p "${CCACHE_DIR}" "${VCPKG_ARCHIVES_DIR}" "${VCPKG_DOWNLOADS_DIR}"
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=base_dir="${CCACHE_BASEDIR}"
          ccache --set-config=compiler_check="${CCACHE_COMPILERCHECK}"
          ccache --set-config=compression="${CCACHE_COMPRESS}"
          ccache --set-config=compression_level="${CCACHE_COMPRESSLEVEL}"
          ccache --set-config=hash_dir=false
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --zero-stats

      - name: Configure production build
        env:
          VCPKG_FEATURE_FLAGS: binarycaching
          VCPKG_BINARY_SOURCES: clear;files,${{ env.VCPKG_ARCHIVES_DIR }},readwrite
          VCPKG_DOWNLOADS: ${{ env.VCPKG_DOWNLOADS_DIR }}
        run: |
          cmake -S . -B build/production-smoke -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEQEMU_BUILD_SERVER=ON \
            -DEQEMU_BUILD_LOGIN=ON \
            -DEQEMU_BUILD_CLIENT_FILES=ON \
            -DEQEMU_BUILD_TESTS=OFF \
            -DEQEMU_BUILD_LUA=OFF \
            -DEQEMU_BUILD_PERL=OFF

      - name: Build production targets
        run: cmake --build build/production-smoke --parallel 8

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats

  unit-tests:
    name: C++ Unit Tests
    needs: changes
    if: needs.changes.outputs.run_full_ci == 'true'
    runs-on:
      group: EQEmu
      labels:
        - self-hosted
        - linux
    container:
      image: ubuntu:24.04
      options: --cpus 8
      volumes:
        - eqemu-monomyth-build-cache:/mnt/eqemu-cache
    timeout-minutes: 60

    steps:
      - name: Install build tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            autoconf \
            automake \
            build-essential \
            ca-certificates \
            ccache \
            cmake \
            curl \
            git \
            libtool \
            make \
            nasm \
            ninja-build \
            perl \
            pkg-config \
            python3 \
            tar \
            unzip \
            uuid-dev \
            zip \
            zstd

      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: recursive
          set-safe-directory: true

      - name: Trust workspace for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Prepare caches
        run: |
          mkdir -p "${CCACHE_DIR}" "${VCPKG_ARCHIVES_DIR}" "${VCPKG_DOWNLOADS_DIR}"
          ccache --set-config=cache_dir="${CCACHE_DIR}"
          ccache --set-config=base_dir="${CCACHE_BASEDIR}"
          ccache --set-config=compiler_check="${CCACHE_COMPILERCHECK}"
          ccache --set-config=compression="${CCACHE_COMPRESS}"
          ccache --set-config=compression_level="${CCACHE_COMPRESSLEVEL}"
          ccache --set-config=hash_dir=false
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --zero-stats

      - name: Configure tests
        env:
          VCPKG_FEATURE_FLAGS: binarycaching
          VCPKG_BINARY_SOURCES: clear;files,${{ env.VCPKG_ARCHIVES_DIR }},readwrite
          VCPKG_DOWNLOADS: ${{ env.VCPKG_DOWNLOADS_DIR }}
        run: |
          cmake -S . -B build/unit-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DEQEMU_BUILD_SERVER=OFF \
            -DEQEMU_BUILD_LOGIN=OFF \
            -DEQEMU_BUILD_CLIENT_FILES=OFF \
            -DEQEMU_BUILD_TESTS=ON \
            -DEQEMU_BUILD_LUA=OFF \
            -DEQEMU_BUILD_PERL=OFF

      - name: Build tests
        run: cmake --build build/unit-tests --target tests --parallel 8

      - name: Run tests
        working-directory: build/unit-tests
        run: ./bin/tests

      - name: Show ccache stats
        if: always()
        run: ccache --show-stats
